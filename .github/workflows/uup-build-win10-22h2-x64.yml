name: uup-build-win10-22h2-x64
run-name: uup-build-win10-22h2-x64-${{ github.run_id }}

on:
  workflow_dispatch:
  schedule:
    - cron: "58 16 14,29 * *"

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/uup-build-iso.yml
    with:
      versions: Windows_10_22H2
      architecture: x64
      edition: Pro
      language: Chinese(SC)
      revision: ""
      esd: true
      netfx3: true
      drivers: false
    secrets: inherit
